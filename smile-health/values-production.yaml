# Production values for smile-health Helm chart
# Override values.yaml for production environment

global:
  imageRegistry: "your-registry.com"
  imagePullSecrets:
    - name: registry-secret

replicaCount: 3

image:
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: smile-health.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: smile-health-tls
      hosts:
        - smile-health.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Backend Services - Production
backend:
  core:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: core-secrets
      
  immunization:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: immunization-secrets
      
  medicine:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: medicine-secrets
      
  auth:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: auth-secrets
      
  main:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: main-secrets
      
  sync:
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    envFrom:
      - secretRef:
          name: sync-secrets
      
  warehouse:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: warehouse-secrets
      
  mainApi:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: main-api-secrets
      
  warehouseApi:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: warehouse-api-secrets
      
  notification:
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    envFrom:
      - secretRef:
          name: notification-secrets

# Frontend Services - Production
frontend:
  web:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
        
  storybook:
    enabled: false
    
  wms:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Nginx - Disabled
nginx:
  enabled: false

# Dependencies - Production
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: "redis-secret"
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "fast-ssd"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

mysql:
  enabled: true
  auth:
    existingSecret: "mysql-secret"
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "fast-ssd"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi

rabbitmq:
  enabled: true
  auth:
    existingSecret: "rabbitmq-secret"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "fast-ssd"
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

keycloak:
  enabled: true
  auth:
    existingSecret: "keycloak-secret"
  database:
    type: mysql
    hostname: smile-health-mysql
    port: 3306
    database: keycloak
    user: smile_user
    existingSecret: "mysql-secret"
  extraEnv: |
    - name: KEYCLOAK_IMPORT
      value: /opt/keycloak/data/import/realm.json
    - name: JAVA_OPTS_APPEND
      value: "-Dkeycloak.profile.feature.upload_scripts=enabled"
  initContainers: |
    - name: import-realm
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak to start..."
          until curl -f http://localhost:8080/health/ready; do
            sleep 2
          done
          
          # Check if realm already exists
          if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:8080/admin/realms/smile-health \
            -u admin:$(cat /tmp/admin-password) | grep -q "200"; then
            echo "Realm 'smile-health' already exists, skipping import"
          else
            echo "Importing realm configuration..."
            curl -X POST -H "Content-Type: application/json" \
              -d @/config/realm.json \
              http://localhost:8080/admin/realms \
              -u admin:$(cat /tmp/admin-password)
            echo "Realm import completed"
          fi
      volumeMounts:
        - name: realm-config
          mountPath: /config
        - name: admin-password
          mountPath: /tmp
  extraVolumeMounts: |
    - name: realm-config
      mountPath: /opt/keycloak/data/import
  extraVolumes: |
    - name: realm-config
      configMap:
        name: {{ include "smile-health.fullname" . }}-keycloak-realm
    - name: admin-password
      secret:
        secretName: {{ include "smile-health.fullname" . }}-keycloak
        items:
          - key: admin-password
            path: admin-password
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

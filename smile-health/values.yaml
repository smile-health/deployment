# Nginx Ingress Controller - Disabled
nginx:
  enabled: false

# Dependencies Configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 4Gi

mysql:
  enabled: true
  auth:
    rootPassword: "mysql123"
    database: "smile_health"
    username: "smile_user"
    password: "smile123"
  primary:
    persistence:
      enabled: true
      size: 8Gi
    initdb:
      scripts:
        create_keycloak_db.sql: |
          CREATE DATABASE IF NOT EXISTS keycloak CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE IF NOT EXISTS smile_imun CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE IF NOT EXISTS smile_logistic CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON keycloak.* TO 'smile_user'@'%';
          GRANT ALL PRIVILEGES ON smile_imun.* TO 'smile_user'@'%';
          GRANT ALL PRIVILEGES ON smile_logistic.* TO 'smile_user'@'%';
          FLUSH PRIVILEGES;

rabbitmq:
  enabled: true
  auth:
    username: "smile_user"
    password: "smile123"
  persistence:
    enabled: true
    size: 4Gi

keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: admin123
    existingSecret: ""
  database:
    type: mysql
    hostname: smile-health-mysql
    port: 3306
    database: keycloak
    user: smile_user
    password: smile123
  extraEnv: |
    - name: KEYCLOAK_IMPORT
      value: /opt/keycloak/data/import/realm.json
    - name: JAVA_OPTS_APPEND
      value: "-Dkeycloak.profile.feature.upload_scripts=enabled"
  initContainers: |
    - name: import-realm
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak to start..."
          until curl -f http://localhost:8080/health/ready; do
            sleep 2
          done
          
          # Check if realm already exists
          if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:8080/admin/realms/smile-health \
            -u admin:$(cat /tmp/admin-password) | grep -q "200"; then
            echo "Realm 'smile-health' already exists, skipping import"
          else
            echo "Importing realm configuration..."
            curl -X POST -H "Content-Type: application/json" \
              -d @/config/realm.json \
              http://localhost:8080/admin/realms \
              -u admin:$(cat /tmp/admin-password)
            echo "Realm import completed"
          fi
      volumeMounts:
        - name: realm-config
          mountPath: /config
        - name: admin-password
          mountPath: /tmp
  extraVolumeMounts: |
    - name: realm-config
      mountPath: /opt/keycloak/data/import
  extraVolumes: |
    - name: realm-config
      configMap:
        name: {{ include "smile-health.fullname" . }}-keycloak-realm
    - name: admin-password
      secret:
        secretName: {{ include "smile-health.fullname" . }}-keycloak
        items:
          - key: admin-password
            path: admin-password
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8080
        targetPort: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

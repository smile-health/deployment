# Staging values for smile-health Helm chart
# Override values.yaml for staging environment

global:
  imageRegistry: "your-staging-registry.com"
  imagePullSecrets:
    - name: staging-registry-secret

replicaCount: 1

image:
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: smile-health-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: smile-health-staging-tls
      hosts:
        - smile-health-staging.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

# Backend Services - Staging
backend:
  core:
    envFrom:
      - configMapRef:
          name: core-config-staging
      - secretRef:
          name: core-secrets-staging
      
  immunization:
    env:
      - name: FALLBACK_SERVER_URL
        value: "http://staging.badr.co.id:8005"
      - name: WORKSPACE_ID
        value: "1"
      - name: DB_NAME
        value: "smile_imun_staging"
    envFrom:
      - configMapRef:
          name: immunization-config-staging
      - secretRef:
          name: immunization-secrets-staging
      
  medicine:
    env:
      - name: FALLBACK_SERVER_URL
        value: "http://staging.badr.co.id:6012"
      - name: WORKSPACE_ID
        value: "2"
      - name: DB_NAME
        value: "smile_logistic_staging"
    envFrom:
      - configMapRef:
          name: medicine-config-staging
      - secretRef:
          name: medicine-secrets-staging
      
  auth:
    envFrom:
      - configMapRef:
          name: auth-config-staging
      - secretRef:
          name: auth-secrets-staging
      
  main:
    envFrom:
      - configMapRef:
          name: main-config-staging
      - secretRef:
          name: main-secrets-staging
      
  sync:
    envFrom:
      - configMapRef:
          name: sync-config-staging
      - secretRef:
          name: sync-secrets-staging
      
  warehouse:
    envFrom:
      - configMapRef:
          name: warehouse-config-staging
      - secretRef:
          name: warehouse-secrets-staging
      
  mainApi:
    envFrom:
      - configMapRef:
          name: main-api-config-staging
      - secretRef:
          name: main-api-secrets-staging
      
  warehouseApi:
    envFrom:
      - configMapRef:
          name: warehouse-api-config-staging
      - secretRef:
          name: warehouse-api-secrets-staging
      
  notification:
    envFrom:
      - configMapRef:
          name: notification-config-staging
      - secretRef:
          name: notification-secrets-staging

# Frontend Services - Staging
frontend:
  web:
    env:
      - name: NODE_ENV
        value: "staging"
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"
      - name: API_URL
        value: "https://smile-health-staging.example.com/api"
        
  storybook:
    enabled: true
    
  wms:
    env:
      - name: NODE_ENV
        value: "staging"
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"
      - name: API_URL
        value: "https://smile-health-staging.example.com/api"

# Nginx - Disabled
nginx:
  enabled: false

# Dependencies - Staging
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

mysql:
  enabled: true
  auth:
    rootPassword: "staging123"
    database: "smile_health_staging"
    username: "smile_user"
    password: "staging123"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

rabbitmq:
  enabled: true
  auth:
    username: "smile_user"
    password: "staging123"
  persistence:
    enabled: true
    size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

keycloak:
  enabled: true
  auth:
    adminUser: staging-admin
    adminPassword: staging123
  database:
    type: mysql
    hostname: smile-health-mysql
    port: 3306
    database: keycloak_staging
    user: smile_user
    password: staging123
  extraEnv: |
    - name: KEYCLOAK_IMPORT
      value: /opt/keycloak/data/import/realm.json
    - name: JAVA_OPTS_APPEND
      value: "-Dkeycloak.profile.feature.upload_scripts=enabled"
  initContainers: |
    - name: import-realm
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak to start..."
          until curl -f http://localhost:8080/health/ready; do
            sleep 2
          done
          
          # Check if realm already exists
          if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:8080/admin/realms/smile-health \
            -u admin:$(cat /tmp/admin-password) | grep -q "200"; then
            echo "Realm 'smile-health' already exists, skipping import"
          else
            echo "Importing realm configuration..."
            curl -X POST -H "Content-Type: application/json" \
              -d @/config/realm.json \
              http://localhost:8080/admin/realms \
              -u admin:$(cat /tmp/admin-password)
            echo "Realm import completed"
          fi
      volumeMounts:
        - name: realm-config
          mountPath: /config
        - name: admin-password
          mountPath: /tmp
  extraVolumeMounts: |
    - name: realm-config
      mountPath: /opt/keycloak/data/import
  extraVolumes: |
    - name: realm-config
      configMap:
        name: {{ include "smile-health.fullname" . }}-keycloak-realm
    - name: admin-password
      secret:
        secretName: {{ include "smile-health.fullname" . }}-keycloak
        items:
          - key: admin-password
            path: admin-password
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

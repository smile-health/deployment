{{- if .Values.ingress.enabled -}}
{{- range $key, $service := .Values.frontend }}
{{- if $service.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smile-health.fullname" $ }}-{{ $key }}
  labels:
    {{- include "smile-health.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls }}
  tls:
    {{- range $.Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $.Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "smile-health.fullname" $ }}-{{ $key }}
                port:
                  number: {{ $service.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}

apiVersion: v2
name: smile-health
description: A Helm chart for Smile Health application
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: mysql
    version: 9.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: rabbitmq
    version: 11.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  - name: keycloak
    version: 18.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled

services:
  auth-service:
    container_name: auth-service
    build:
      context: ../../../backend/apps/auth-service
    restart: unless-stopped
    env_file:
      - ../env/.env
      - ../env/auth-service.env
    networks:
      - smile-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.auth-service.rule: "PathPrefix(`/auth`)"
      traefik.http.routers.auth-service.entrypoints: "web"
      traefik.http.services.auth-service.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


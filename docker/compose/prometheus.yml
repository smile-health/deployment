global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'smile-health-monitor'

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'docker'
    static_configs:
      - targets: ['unix:///var/run/docker.sock']
